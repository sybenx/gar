# GAR speech eval: short assistant commands for gar/stt/eval/run.py (see README.md there).
# Audio is synthesized by make_clips.py with macOS `say` into ~/.cache/gar/stt-eval/clips/ (not in git).
#
# Each clip:
#   text    what was said, in GAR's spoken form (lowercase words, numbers as words): the reference
#   say     what `say` reads, when it differs (punctuation for prosody, digits, or a phonetic spelling
#           for names `say` gets wrong: the reference keeps the real spelling)
#   type    command type, for the breakdown
#   names   contact names said in the clip, spoken form (scored as name accuracy)
#   prompt  the contact names a phone would give Whisper: the clip's own names plus distractors
#           from `contacts` (the names-in-prompt mode); the names-without mode drops the clip's own
#   voice   `say` voice; noise: true adds light noise and a level change
#   wav     a recorded clip instead of `say`, relative to ~/.cache/gar/stt-eval/clips/
#
# owner goes first in every prompt but others-40, as the app puts the owner's own name first
# (own_contact_name, the profile, "Your name"); starred are the phone mode's starred contacts. All of these clips were seen while
# choosing the prompt format and the token cap: a held-out set should be new (real) recordings.
