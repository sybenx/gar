# GAR router eval set: what the LLM fallback sees when Dicio's sentence matcher misses.
# Utterances are written the way Vosk small-en-us transcribes speech: lowercase words only, numbers
# spelled out, no punctuation except apostrophes, and some real mishearings from the Step 1 STT run
# ("spot if i" for Spotify, "you tube", "urine" for Aaron, "my johnson" for Mike Johnson,
# "time or" for "timer"). Whisper's text reaches the router in the same form through SpokenForm,
# and gar/eval/stt/make-whisper-cases.sh makes a Whisper version of this file.
#
# Each case:
#   text:     the transcript
#   tool:     expected tool from app/src/main/gar/tools.yml, or no_match for out-of-scope requests
#   slots:    slot -> accepted value, or list of accepted values (word spans of the text; compared
#             after normalization). Expected slots must all be present with an accepted value.
#   optional: slots that may be filled or left out, with any value
#   stt:      vosk when the text has a Vosk mishearing or word split that other recognizers don't
#             make ("call urine", "you tube"); the expectations stay those of the text
#   said:     what was meant, where known, in the same spoken form ("call aaron"). The Whisper set
#             (gar/eval/stt) speaks it instead of the text
# A slot that is filled but neither in `slots` nor in `optional` makes the slots inexact.
#
# Add cases freely; group them by tool. New tools (Step 3) only need their cases added here.
#
# Prompt tuning (2026-10-25) split each group, negatives included: the first 70% (rounded) of the
# cases above its "added 2026-10-25" marker were dev, the rest of them held-out. The marked cases
# were written before any variant ran and never tuned on. Tune on dev the same way next time.
# The 2026-10-26 tuning (descriptions, with the call filters) used the same split: cases marked
# "added ... with the tool's keywords" are held out too. The groups added with batches 3 and 4
# (2026-10-27) are held out, except the cases marked "added 2026-10-27 (batch 3-4), dev": tune
# device_setting and media_play on those.
