      duration: twenty five minute
      name: [pizza, the pizza]
  - text: set the time or for forty seconds
    stt: vosk
    said: set the timer for forty seconds
    tool: timer_set
    slots:
      duration: forty seconds
  - text: count down one hour and fifteen minutes
    tool: timer_set
    slots:
      duration: one hour and fifteen minutes
  - text: start a timer
    tool: timer_set
    optional: [duration]

