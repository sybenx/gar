# GAR router BLIND held-out eval set (written 2026-10-26).
# Added 2026-10-26 for Step 5 (marked "added 2026-10-26 (Step 5), blind"): one more case each for
# nine tools, a song_identify group and song near misses. Written blind from only the tool names,
# descriptions and slots of tools.yml (no examples, keywords or confirm fields) and this file.
#
# Written without looking at cases.yml's cases, the probe set, any eval report, tools.yml's
# keywords / confirm fields / examples, or any code. Sources: the tool names, descriptions and slot
# descriptions in app/src/main/gar/tools.yml, the "Step 3 skills" table in gar/DESIGN.md, and the
# format header of cases.yml. Never tune prompts, descriptions, keywords or filters on this file;
# it only measures. If a case here turns out to be wrong, fix the expectation, not the router.
#
# Same format and transcript style as cases.yml: lowercase words only, numbers spelled out, no
# punctuation except apostrophes, a few plausible Vosk mishearings ("time or", "paws", "flash
# light", "you tube", "what's app", "wake would", "stop watch", "lab", "blue tooth", "d n d").
#
# Each case:
#   text:     the transcript
#   tool:     expected tool, or no_match for out-of-scope requests
#   slots:    slot -> accepted value, or list of accepted values (word spans of the text)
#   optional: slots that may be filled or left out, with any value
#   stt:      vosk for a Vosk mishearing or word split (tagged 2026-11-01, as in cases.yml)
#   said:     what was meant, where known; the Whisper set (gar/eval/stt) speaks it instead
# Commands with a missing value ("set an alarm", "remind me to call mom") expect the tool with a
# missing required slot in `optional`: the grammar always fills required slots (with some words of
# the command), so the model can't leave them out. A missing optional slot is expected left out.
# Expectations fixed after the first runs (2026-10-26) where they contradicted tools.yml or this
# format; no text changed.
