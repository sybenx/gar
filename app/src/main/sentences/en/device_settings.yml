# GAR (gar:settings): DeviceSettingsSkill only takes a match whose words name the setting
# (DeviceSettingWords), since Dicio's matcher takes a sentence with a word left out or swapped.
# turn_on, turn_off and status leave the setting to those words. Wi-Fi and Bluetooth on, off and
# their settings stay with the connectivity sentences; the ringer has sentences of its own
# ("turn on silent mode" is the ringer off). Night light only switches on its page, which
# turn_on and turn_off open ("Here's night light.").
