  - play|stream|queue|blast .query. on|in|with|using|through|via|from .app. (app)?
  - (queue up)|(start playing)|(put on)|(throw on)|(listen to)|hear .query.
  - (queue up)|(start playing)|(put on)|(throw on)|(listen to)|hear .query. on|in|with|using|through|via|from .app. (app)?
  - (i want to)|(i wanna)|(i d like to)|(let me)|(let s)|(can i) (listen to)|hear .query.
  - (i want to)|(i wanna)|(i d like to)|(let me)|(let s)|(can i) (listen to)|hear .query. on|in|with|using|from .app. (app)?
  # "start" only for a playlist, a podcast, an album or an episode (MediaPlayWords)
  - start .query.
