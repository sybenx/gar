name: Continuous integration

# GAR: Dicio's workflow, on the gar branch, with the submodules and the NDK; lint is left out

on:
  workflow_dispatch:
  pull_request:
    branches:
      - gar
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
      - 'meta/**'
      - '.github/FUNDING.yml'
  push:
    branches:
      - gar
    paths-ignore:
      - '**.md'
      - 'fastlane/**'
      - 'meta/**'
      - '.github/FUNDING.yml'

jobs:
  build-and-test-jvm:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Make sure Gradle wrapper is legitimate
        uses: gradle/actions/wrapper-validation@v5

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"

      - uses: gradle/actions/setup-gradle@v5

      - name: Install NDK and CMake
        run: |
          NDK=$(sed -nE 's/^garNdk = "(.*)"/\1/p' gradle/libs.versions.toml)
          CMAKE=$(sed -nE 's/^garCmake = "(.*)"/\1/p' gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK" "cmake;$CMAKE" > /dev/null

      - name: Build debug APK and run jvm tests
        # the debug application id comes from the branch, a pull request's checkout is detached
        run: ./gradlew -PgarIdSuffix=ci assembleDebug testDebugUnitTest --stacktrace
